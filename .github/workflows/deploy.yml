name: Deploy Quartz site to Cloudflare Pages

on:
  push:
    branches:
      - main
  # Trigger manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-cloudflare"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Quartz Plugins
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build

      # robots.txt and _headers must sit at the deploy root (public/).
      # quartz/static maps to /static, so we inject these here instead.
      - name: Add root files (robots.txt, _headers)
        run: cp deploy/robots.txt deploy/_headers public/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=notes --branch=main
